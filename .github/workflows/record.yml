name: Запись котировок Dual Assets

# ВНИМАНИЕ: с раннеров GitHub этот workflow работать не может.
#
# Bybit блокирует диапазоны дата-центров через CloudFront: все эндпоинты и все
# зеркала (api.bybit.com, api.bytick.com, api.bybit.nl) отдают 403 — проверено
# `scripts/probe.mjs`, запускается через workflow «Диагностика доступа к Bybit».
# Поэтому расписания здесь нет: оно давало бы только поток красных прогонов.
#
# Архив ставок вместо этого копится в браузере (web/archive.js), пока панель
# открыта. Непрерывный ряд можно собирать своим self-hosted раннером или с
# домашней машины — см. docs/ПРОЕКТ.md. Ручной запуск оставлен на случай, если
# фильтрация со стороны биржи изменится: сначала прогоните диагностику.
on:
  workflow_dispatch:

permissions:
  contents: write

# Две записи одновременно затёрли бы друг друга при форс-пуше ветки data.
concurrency:
  group: dual-assets-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Забрать текущее состояние ветки data
        run: |
          git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-branch 2>/dev/null || {
            echo "ветки data ещё нет, создаём с нуля"
            mkdir -p data-branch
          }

      - name: Снять снимок и пересобрать сводку
        run: node scripts/record.mjs --out data-branch

      - name: Опубликовать одиночным коммитом
        run: |
          cd data-branch
          rm -rf .git
          git init -q
          git config user.name "dual-assets-recorder"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Снимок котировок $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:data
          echo "опубликовано: $(du -sh . | cut -f1)"
