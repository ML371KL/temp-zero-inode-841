name: Публикация панели

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dual-assets-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Только офлайн-часть набора. Bybit блокирует диапазоны дата-центров
      # через CloudFront: с раннеров GitHub все эндпоинты и все зеркала биржи
      # отдают 403 (проверено scripts/probe.mjs). Живые инварианты расписания
      # продуктов гоняются локально: `node scripts/selftest.mjs`.
      - name: Самопроверка расчётов
        run: node scripts/selftest.mjs --offline

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
